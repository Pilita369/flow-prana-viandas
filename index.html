<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mundo Prana · Viandas saludables</title>
    <meta name="description" content="Tu panel de seguimiento de viandas Mundo Prana" />
    <meta name="application-name" content="Mundo Prana" />
    <meta name="author" content="Mundo Prana" />
    <meta name="theme-color" content="#27684a" />

    <!-- Iconos (pestaña del navegador e instalación en el celular) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Mundo Prana" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph (imagen al compartir en WhatsApp, Instagram, etc.) -->
    <meta property="og:site_name" content="Mundo Prana" />
    <meta property="og:title" content="Mundo Prana · Viandas saludables" />
    <meta property="og:description" content="Seguí tu plan de viandas, puntos y más." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flow-prana-viandas.vercel.app" />
    <meta property="og:image" content="https://flow-prana-viandas.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Mundo Prana: cuchara con hojas verdes" />
    <meta property="og:locale" content="es_AR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mundo Prana" />
    <meta name="twitter:description" content="Tu panel de viandas saludables" />
    <meta name="twitter:image" content="https://flow-prana-viandas.vercel.app/og-image.png" />
  </head>
  <body>
    <script>
      // Panel admin en tema oscuro desde el primer instante (sin destello blanco)
      try {
        if (location.pathname.indexOf('/admin') === 0) {
          document.documentElement.classList.add('admin-ui');
          if (localStorage.getItem('mp_admin_theme') !== 'light') document.documentElement.classList.add('dark');
        } else if (location.pathname.indexOf('/cliente') === 0) {
          // Vista del cliente: apariencia elegida en este dispositivo (claro, oscuro o la del sistema) y alto contraste
          var m = localStorage.getItem('mp_client_theme');
          var oscuro = m === 'dark' || (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add('client-ui');
          if (oscuro) document.documentElement.classList.add('dark');
          if (localStorage.getItem('mp_client_contrast') === 'true') document.documentElement.classList.add('hc');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
